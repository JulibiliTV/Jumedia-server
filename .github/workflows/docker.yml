name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  # Jumedia-web is built into the same image; run this after web changes.
  workflow_dispatch:
  repository_dispatch:
    types: [web-updated]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Read-only deploy key of JulibiliTV/Jumedia-web.
      - uses: actions/checkout@v4
        with:
          repository: JulibiliTV/Jumedia-web
          ssh-key: ${{ secrets.WEB_DEPLOY_KEY }}
          path: web

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/julibilitv/jumedia-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: web=./web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
